# Railway reads this file from the repo root: build the Dockerfile, wait for
# /healthz to answer before switching traffic, restart on a crash.
# The start command is the Dockerfile's CMD; settings go in the service's Variables tab.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
